    <meta name="theme-color" content="#eceff2" />
    <script>
      // Pick the theme before first paint: saved choice, else the system setting
      try {
        var theme = localStorage.getItem("takaran_theme");
        if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
        document.documentElement.dataset.theme = theme;
        if (theme === "night") {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0c1130");
        }
      } catch (e) {}
    </script>
